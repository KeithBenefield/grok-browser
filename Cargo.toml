[package]
name = "grok-browser"
version = "0.3.5"
edition = "2021"
description = "Minimal Windows desktop shell for grok.com (WebView2 / wry)"
repository = "https://github.com/KeithBenefield/grok-browser"
license = "MIT"
readme = "README.md"
keywords = ["grok", "webview", "browser", "wry"]
categories = ["gui"]

[dependencies]
rfd = "0.15"
tao = "0.35"
ureq = "2.12"
wry = "0.55"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
