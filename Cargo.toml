[package]
name = "grok-browser"
version = "0.2.0"
edition = "2021"
description = "Minimal Windows desktop shell for grok.com (WebView2 / wry)"
repository = "https://github.com/KeithBenefield/grok-browser"
license = "MIT"
readme = "README.md"
keywords = ["grok", "webview", "browser", "wry"]
categories = ["gui"]

[dependencies]
wry = "0.24"

[profile.release]
lto = true
codegen-units = 1
strip = true
